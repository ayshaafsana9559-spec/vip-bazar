<svg xmlns="http://www.w3.org/2000/svg" width="726" height="596" viewBox="0 0 512 420">
  <defs>
    <linearGradient id="g500" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FA4616"/>
      <stop offset="0.4" stop-color="#0E1305"/>
      <stop offset="0.72" stop-color="#215ADA"/>
      <stop offset="1" stop-color="#6F4FF7"/>
    </linearGradient>
    <linearGradient id="gTri" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#FA4616"/>
      <stop offset="0.45" stop-color="#0E1305"/>
      <stop offset="1" stop-color="#6F4FF7"/>
    </linearGradient>
    <linearGradient id="gWrench" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6F4FF7"/>
      <stop offset="0.3" stop-color="#FA4616"/>
      <stop offset="0.6" stop-color="#0E1305"/>
      <stop offset="1" stop-color="#215ADA"/>
    </linearGradient>
  </defs>

  <!-- lavender blob -->
  <path d="M28 330 C 2 262, 40 190, 66 130 C 96 60, 170 14, 262 8 C 352 2, 420 34, 462 96 C 500 152, 506 240, 490 312 C 482 348, 470 362, 452 368 L 44 368 C 36 356, 32 344, 28 330 Z" fill="#EFEBFE"/>

  <!-- big warning triangle (half hidden behind the screen) -->
