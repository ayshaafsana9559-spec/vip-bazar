<!-- Room card start -->
<a href="javascript:void(0)" class="room-card bg-white tw-rounded-xl h-100 d-flex flex-column">
    <span class="room-card__thumb d-flex align-items-center justify-content-center bg-slate-25 tw-rounded-lg overflow-hidden">
        <img src="assets/images/thumbs/furniture/@@image.png" alt="@@title">
    </span>
    <span class="room-card__body d-flex align-items-center justify-content-between tw-gap-2">
        <span class="room-card__text">
            <span class="room-card__title d-block font-heading fw-semibold text-slate-800 text-truncate">@@title</span>
            <span class="room-card__units d-block text-slate-600">@@units units</span>
        </span>
        <span class="room-card__arrow flex-shrink-0"><i class="ph ph-caret-right"></i></span>
    </span>
</a>
<!-- Room card end -->
