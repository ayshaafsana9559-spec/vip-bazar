<!-- Product card two start -->
<div class="product-card product-card--two bg-white border border-slate-200 tw-rounded-xl h-100 d-flex flex-column">
    <div class="product-card__thumb position-relative bg-slate-25 tw-rounded-lg overflow-hidden">
        <a href="javascript:void(0)" class="d-block w-100 h-100">
            <img src="assets/images/thumbs/products/@@image.png" alt="@@name" class="w-100 h-100 object-fit-cover">
        </a>
        <span class="product-card__pill product-card__pill--start position-absolute rounded-pill @@tone">@@label</span>
        <span class="product-card__pill product-card__pill--end position-absolute rounded-pill bg-purple-600 text-white">35.2K Sold</span>
        <div class="product-card__actions position-absolute d-flex tw-gap-2 bg-white rounded-pill">
            <button type="button" class="product-card__action" aria-label="Add to wishlist"><i class="ph ph-heart"></i></button>
            <button type="button" class="product-card__action" aria-label="Quick view"><i class="ph ph-eye"></i></button>
            <button type="button" class="product-card__action" aria-label="Compare"><i class="ph ph-arrows-left-right"></i></button>
        </div>
    </div>

    <div class="product-card__body d-flex flex-column flex-grow-1">
        <div class="d-flex align-items-center justify-content-between tw-gap-2">
            <div class="d-flex align-items-center tw-gap-1">
                <a href="javascript:void(0)" class="product-card__category text-main-600 hover-underline">@@category</a>
                <span class="product-card__off bg-orange-50 border border-orange-100 text-orange-600 rounded-pill">-34%</span>
            </div>
            <div class="d-flex align-items-center tw-gap-05">
                <span class="product-card__color" title="Blue"><span class="bg-main-600"></span></span>
                <span class="product-card__color" title="Green"><span class="bg-green-600"></span></span>
            </div>
        </div>
        <h3 class="product-card__title fw-semibold text-slate-800 line-clamp-1">
            <a href="javascript:void(0)" class="hover-text-main-600">@@name</a>
        </h3>
        <p class="product-card__desc text-slate-500">Experience premium quality, modern design, and reliable performance.</p>

        <div class="product-card__meta d-flex align-items-center flex-wrap text-slate-500">
            <span class="product-card__stars d-flex align-items-center text-yellow-600" aria-label="Rated 4.5 out of 5">
                <i class="ph-fill ph-star"></i>
                <i class="ph-fill ph-star"></i>
                <i class="ph-fill ph-star"></i>
                <i class="ph-fill ph-star"></i>
                <i class="ph-fill ph-star-half"></i>
            </span>
            <span>(32.5K)</span>
            <span class="product-card__dot"></span>
            <span class="d-flex align-items-center tw-gap-1">
                <i class="ph ph-package text-purple-600 tw-text-base tw-leading-none"></i>
                Free Shipping
            </span>
        </div>
        <div class="product-card__price d-flex align-items-center flex-wrap">
            <del class="product-card__old text-decoration-none">$89.00</del>
            <span class="product-card__new text-orange-600 fw-extrabold">$59.00</span>
            <span class="product-card__in-stock d-inline-flex align-items-center tw-gap-2 bg-green-50 border border-green-100 text-green-600 rounded-pill">
                <span class="product-card__stock bg-green-600"></span>
                In Stock
            </span>
        </div>

        <div class="product-card__footer border-top border-slate-100 mt-auto">
            <a href="javascript:void(0)" class="product-card__cart btn btn-outline-main hover-style-two button--stroke tw-duration-100 d-flex align-items-center justify-content-center tw-gap-2 w-100 rounded-pill py-0 font-heading fw-semibold tw-text-sm" data-block="button">
                <span class="button__flair"></span>
                <i class="ph ph-shopping-cart-simple tw-text-lg position-relative"></i>
                <span class="button__label">Add To Cart</span>
            </a>
        </div>
    </div>
</div>
<!-- Product card two end -->
