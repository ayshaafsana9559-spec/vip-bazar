<!-- ==================== Header Start Here ==================== -->
<header class="header tw-transition-all tw-z-99">
  <!-- Header Middle Start -->
  <div class="header-middle bg-slate-50">
    <div class="container container-two">
      <div class="header-middle__inner d-flex align-items-center tw-gap-6">
        <!-- Logo Start -->
        <div class="logo flex-shrink-0">
          <a href="index.html" class="link d-flex">
            <img src="assets/images/logo/logo.png" alt="eCommex">
          </a>
        </div>
        <!-- Logo End  -->

        <!-- Search Start -->
        <form action="#" class="header-search max-w-806-px w-100 bg-white border border-slate-100 rounded-pill d-lg-flex d-none align-items-center">
          <div class="dropdown flex-shrink-0">
            <button type="button" class="d-flex align-items-center tw-gap-2 text-slate-800 tw-text-sm hover-text-main-600" data-bs-toggle="dropdown" aria-expanded="false">
              Category
              <i class="ph ph-caret-down tw-text-sm tw-leading-none"></i>
            </button>
            <ul class="dropdown-menu tw-text-sm">
              <li><a class="dropdown-item" href="javascript:void(0)">Electronics</a></li>
              <li><a class="dropdown-item" href="javascript:void(0)">Fashion</a></li>
              <li><a class="dropdown-item" href="javascript:void(0)">Accessories</a></li>
              <li><a class="dropdown-item" href="javascript:void(0)">Footwear</a></li>
            </ul>
          </div>
          <span class="header-search__divider flex-shrink-0"></span>
          <input type="text" class="header-search__input flex-grow-1 bg-transparent border-0 focus-outline-0 text-slate-800 tw-text-sm" placeholder="Search hare...">
          <button type="submit" class="btn btn-main-two hover-style-two button--stroke tw-duration-100 d-inline-flex align-items-center justify-content-center rounded-pill flex-shrink-0 tw-h-705 tw-px-405 py-0 font-heading fw-semibold tw-text-13-px" data-block="button">
            <span class="button__flair"></span>
            <span class="button__label">Search</span>
          </button>
        </form>
        <!-- Search End -->

        <!-- Header Right Start -->
        <div class="d-flex align-items-center tw-gap-205 flex-shrink-0 ms-auto">
          <div class="header-actions d-flex align-items-center">
            <button type="button" class="header-action tw-w-11 tw-h-11 bg-white border border-slate-100 rounded-circle d-flex justify-content-center align-items-center text-heading tw-text-xl position-relative hover-bg-main-600 hover-text-white" aria-label="Search">
              <i class="ph ph-magnifying-glass"></i>
            </button>
            <a href="javascript:void(0)" class="header-action tw-w-11 tw-h-11 bg-white border border-slate-100 rounded-circle d-flex justify-content-center align-items-center text-heading tw-text-xl position-relative hover-bg-main-600 hover-text-white" aria-label="Wishlist">
              <i class="ph ph-heart"></i>
              <span class="header-action__badge tw-w-6 tw-h-6 rounded-circle bg-green-600 text-white d-flex justify-content-center align-items-center position-absolute font-heading fw-semibold tw-text-sm">5</span>
            </a>
            <a href="javascript:void(0)" class="header-action tw-w-11 tw-h-11 bg-white border border-slate-100 rounded-circle d-flex justify-content-center align-items-center text-heading tw-text-xl position-relative hover-bg-main-600 hover-text-white" aria-label="Cart">
              <i class="ph ph-shopping-cart-simple"></i>
              <span class="header-action__badge tw-w-6 tw-h-6 rounded-circle bg-orange-600 text-white d-flex justify-content-center align-items-center position-absolute font-heading fw-semibold tw-text-sm">1</span>
            </a>
          </div>
          <a href="register.html" class="btn btn-main hover-style-one button--stroke tw-duration-100 d-sm-inline-flex d-none align-items-center justify-content-center tw-gap-105 rounded-pill tw-h-11 tw-px-7 py-0 font-heading fw-semibold tw-text-13-px" data-block="button">
            <span class="button__flair"></span>
            <span class="button__label">Register</span>
            <i class="ph ph-arrow-up-right tw-text-base position-relative"></i>
          </a>
          <button type="button" class="toggle-mobileMenu d-lg-none tw-leading-none text-heading tw-text-9 tw-ms-2" aria-label="Open menu">
            <i class="ph ph-list"></i>
          </button>
        </div>
        <!-- Header Right End -->
      </div>
    </div>
  </div>
  <!-- Header Middle End -->

  <!-- Header Nav Start -->
  <div class="header-nav bg-white border-bottom border-slate-100 d-lg-block d-none">
    <div class="container container-two">
      <div class="header-nav__inner d-flex align-items-center justify-content-between tw-gap-6">
        <div class="d-flex align-items-center h-100">
          <div class="dropdown h-100">
            <button type="button" class="header-nav__categories h-100 d-flex align-items-center tw-gap-105 tw-px-6 border-start border-end border-slate-100 text-heading tw-text-sm fw-medium hover-text-main-600" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="ph ph-squares-four tw-text-lg tw-leading-none"></i>
              Categories
              <i class="ph ph-caret-down tw-text-sm tw-leading-none"></i>
            </button>
            <ul class="dropdown-menu tw-text-sm">
              <li><a class="dropdown-item" href="javascript:void(0)">Electronics</a></li>
              <li><a class="dropdown-item" href="javascript:void(0)">Fashion</a></li>
              <li><a class="dropdown-item" href="javascript:void(0)">Accessories</a></li>
              <li><a class="dropdown-item" href="javascript:void(0)">Footwear</a></li>
              <li><a class="dropdown-item" href="javascript:void(0)">Industrial</a></li>
              <li><a class="dropdown-item" href="javascript:void(0)">Kitchen</a></li>
            </ul>
          </div>
          <div class="header-menu tw-ps-6">
            @@include('../partials/_nav-menu.html', { "class" : "tw-gap-5" })
          </div>
        </div>
        <ul class="d-flex align-items-center tw-gap-505">
          <li><a href="javascript:void(0)" class="text-slate-600 tw-text-sm hover-text-main-600">Refund Policy</a></li>
          <li><a href="javascript:void(0)" class="text-slate-600 tw-text-sm hover-text-main-600">Support &amp; FAQs</a></li>
        </ul>
      </div>
    </div>
  </div>
  <!-- Header Nav End -->
</header>
<!-- ==================== Header End Here ==================== -->
