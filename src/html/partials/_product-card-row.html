<!-- Product card row start -->
<div class="product-card product-card--row bg-white border border-slate-200 tw-rounded-xl d-flex">
    <div class="product-card__thumb position-relative bg-slate-25 tw-rounded-lg overflow-hidden flex-shrink-0">
        <a href="javascript:void(0)" class="d-block w-100 h-100">
            <img src="assets/images/thumbs/products/@@image.png" alt="@@name" class="w-100 h-100 object-fit-cover">
        </a>
        <span class="product-card__pill position-absolute rounded-pill @@tone">@@label</span>
    </div>

    <div class="product-card__body d-flex flex-column flex-grow-1">
        <div class="d-flex align-items-start justify-content-between tw-gap-2">
            <a href="javascript:void(0)" class="product-card__category text-main-600 hover-underline">@@category</a>
            <div class="d-flex align-items-center tw-gap-05">
                <span class="product-card__color" title="Blue"><span class="bg-main-600"></span></span>
                <span class="product-card__color" title="Green"><span class="bg-green-600"></span></span>
            </div>
        </div>
        <h3 class="product-card__title fw-semibold text-slate-800 line-clamp-1">
            <a href="javascript:void(0)" class="hover-text-main-600">@@name</a>
        </h3>

        <div class="product-card__meta d-flex align-items-center flex-wrap text-slate-600">
            <span class="d-flex align-items-center tw-gap-2 fw-semibold text-slate-800">
                <span class="product-card__stock bg-green-600"></span>
                In Stock
            </span>
            <span class="product-card__dot"></span>
            <span class="d-flex align-items-center tw-gap-1">
                <i class="ph-fill ph-star text-yellow-600 tw-text-base tw-leading-none"></i>
                <span><span class="fw-bold text-slate-800">4.8</span> (32.5K Reviews)</span>
            </span>
            <span class="product-card__dot"></span>
            <span class="d-flex align-items-center tw-gap-1">
                <i class="ph ph-package text-purple-600 tw-text-base tw-leading-none"></i>
                Free Shipping
            </span>
            <span class="product-card__dot"></span>
            <span class="d-flex align-items-center tw-gap-1">
                <i class="ph ph-tag text-main-600 tw-text-base tw-leading-none"></i>
                35.2K Sold
            </span>
            <span class="product-card__dot"></span>
            <span class="product-card__off bg-orange-50 border border-orange-100 text-orange-600 rounded-pill">-34%</span>
        </div>

        <div class="product-card__footer d-flex align-items-center justify-content-between flex-wrap tw-gap-3 border-top border-slate-100 mt-auto">
            <div class="d-flex align-items-baseline tw-gap-2 tw-leading-none">
                <span class="product-card__new text-orange-600 fw-extrabold">$59.00</span>
                <del class="text-slate-500 tw-text-base">$89.00</del>
            </div>
            <div class="d-flex align-items-center tw-gap-105">
                <button type="button" class="product-card__action" aria-label="Quick view"><i class="ph ph-eye"></i></button>
                <button type="button" class="product-card__action" aria-label="Add to wishlist"><i class="ph ph-heart"></i></button>
                <button type="button" class="product-card__action" aria-label="Compare"><i class="ph ph-arrows-left-right"></i></button>
                <a href="javascript:void(0)" class="product-card__cart btn btn-outline-main hover-style-two button--stroke tw-duration-100 d-inline-flex align-items-center justify-content-center rounded-pill py-0 font-heading fw-semibold" data-block="button">
                    <span class="button__flair"></span>
                    <span class="button__label">Add To Cart</span>
                </a>
            </div>
        </div>
    </div>
</div>
<!-- Product card row end -->
