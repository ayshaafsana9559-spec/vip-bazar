<!-- same full-screen shell as the order success page (.success-page) -->
<main class="success-page d-flex flex-column">
    <div class="container container-two">
        <a href="index.html" class="success-page__logo d-inline-flex"><img src="assets/images/logo/logo.png" alt="eCommex"></a>
    </div>

    <div class="success-page__body text-center">
        <div class="container container-two">
            <img src="assets/images/thumbs/success/payment-failed.svg" alt="Hand holding a phone showing a card payment error" class="success-page__art success-page__art--failed">
            <h1 class="success-page__title success-page__title--failed fw-bold text-main-two-600 mx-auto">Oops! Payment Failed: Please Retry Again</h1>
            <p class="success-page__text success-page__text--failed text-slate-600 mx-auto">Uh-oh! It looks like there's an issue with your payment. We kindly ask you to double-check your information and try processing the payment once more. Thank you!</p>
            <div class="d-flex align-items-center justify-content-center flex-wrap tw-gap-2">
                <a href="products.html" class="btn btn-outline-main hover-style-two button--stroke tw-duration-100 d-inline-flex align-items-center justify-content-center tw-gap-2 rounded-pill success-page__btn success-page__btn--wide py-0 font-heading fw-semibold" data-block="button">
                    <span class="button__flair"></span>
                    <i class="ph ph-caret-left tw-text-base position-relative"></i>
                    <span class="button__label">Continue Shopping</span>
                </a>
                <a href="checkout.html" class="btn btn-main hover-style-one button--stroke tw-duration-100 d-inline-flex align-items-center justify-content-center tw-gap-2 rounded-pill success-page__btn py-0 font-heading fw-semibold" data-block="button">
                    <span class="button__flair"></span>
                    <span class="button__label">Try Again Payment</span>
                    <i class="ph ph-caret-right tw-text-base position-relative"></i>
                </a>
            </div>
        </div>
    </div>

    <p class="success-page__copy text-center text-slate-600 mb-0">Copyright © 2026 <a href="index.html" class="text-orange-600">eCommex</a>. All rights reserved.</p>
</main>
