<!-- Testimonial card start -->
<div class="testimonial-card testimonial-card--@@tone tw-rounded-xl h-100 d-flex flex-column">
    <div class="testimonial-card__top">
        <div class="d-flex align-items-center tw-gap-1 text-yellow-600 tw-text-xl tw-leading-none tw-mb-205" aria-label="Rated 4.5 out of 5">
            <i class="ph-fill ph-star"></i>
            <i class="ph-fill ph-star"></i>
            <i class="ph-fill ph-star"></i>
            <i class="ph-fill ph-star"></i>
            <i class="ph-fill ph-star-half"></i>
        </div>
        <h3 class="testimonial-card__title fw-semibold text-slate-800 tw-text-xl tw-mb-4">@@title</h3>
        <p class="testimonial-card__quote text-slate-600 tw-text-sm">“@@quote”</p>
    </div>
    <div class="testimonial-card__bottom d-flex align-items-center justify-content-between tw-gap-4 border-top border-slate-200 mt-auto">
        <div class="d-flex align-items-center tw-gap-405">
            <img src="assets/images/thumbs/avatars/@@avatar.png" alt="@@name" class="testimonial-card__avatar rounded-circle object-fit-cover flex-shrink-0">
            <div>
                <h4 class="font-heading fw-semibold text-heading tw-text-base tw-mb-1">@@name</h4>
                <span class="text-slate-600 tw-text-xs">@@role</span>
            </div>
        </div>
        <i class="testimonial-card__icon ph-light ph-quotes tw-leading-none flex-shrink-0" aria-hidden="true"></i>
    </div>
</div>
<!-- Testimonial card end -->
