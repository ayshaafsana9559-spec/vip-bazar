<!-- ======================================== Contact form start =================================== -->
<section class="contact-section">
    <div class="container container-two">
        <div class="contact-form bg-white border border-slate-100 mx-auto">
            <div class="contact-form__head text-center">
                <span class="contact-form__tagline d-block text-main-600">Contact Us</span>
                <h1 class="contact-form__title fw-semibold text-slate-800">Get in touch with us.</h1>
                <p class="contact-form__sub text-slate-800 mb-0">Fill up the form &amp; our team will get back to you within hours</p>
            </div>
            <form action="#" class="contact-form__form form-submit">
                <div class="contact-form__fields">
                    <div>
                        <label for="contact-name" class="contact-form__label d-block text-slate-800">Name</label>
                        <input type="text" id="contact-name" class="contact-form__input" placeholder="Enter Your Name..." required>
                    </div>
                    <div>
                        <label for="contact-email" class="contact-form__label d-block text-slate-800">Email</label>
                        <input type="email" id="contact-email" class="contact-form__input" placeholder="Enter Your Email..." required>
                    </div>
                    <div>
                        <label for="contact-phone" class="contact-form__label d-block text-slate-800">Phone</label>
                        <input type="tel" id="contact-phone" class="contact-form__input" placeholder="Enter Your Number...">
                    </div>
                    <div>
                        <label for="contact-country" class="contact-form__label d-block text-slate-800">Country</label>
                        <div class="position-relative">
                            <select id="contact-country" class="contact-form__input contact-form__input--select">
                                <option value="" selected>Country...</option>
                                <option value="bd">Bangladesh</option>
                                <option value="ca">Canada</option>
                                <option value="in">India</option>
                                <option value="uk">United Kingdom</option>
                                <option value="us">United States</option>
                            </select>
                            <i class="ph ph-caret-down contact-form__caret" aria-hidden="true"></i>
                        </div>
                    </div>
                    <div class="contact-form__full">
                        <label for="contact-message" class="contact-form__label d-block text-slate-800">Message</label>
                        <textarea id="contact-message" class="contact-form__input contact-form__input--area" placeholder="Enter Your Message..." required></textarea>
                    </div>
                </div>
                <div class="text-center">
                    <button type="submit" class="btn btn-main hover-style-one button--stroke tw-duration-100 d-inline-flex align-items-center justify-content-center tw-gap-2 rounded-pill contact-form__btn py-0 font-heading fw-semibold" data-block="button">
                        <span class="button__flair"></span>
                        <span class="button__label">Sent Message</span>
                        <i class="ph ph-paper-plane-right tw-text-lg position-relative"></i>
                    </button>
                </div>
            </form>
        </div>
    </div>
</section>
<!-- ======================================== Contact form end =================================== -->
