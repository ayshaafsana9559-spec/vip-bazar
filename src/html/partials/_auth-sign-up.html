<!-- ======================================== Sign up start =================================== -->
<!-- full-screen split: form panel left, photo right (no site header/footer) -->
<main class="auth d-flex">
    <div class="auth__panel d-flex flex-column">
        <a href="index.html" class="auth__logo d-inline-flex align-self-start"><img src="assets/images/logo/logo.png" alt="eCommex"></a>

        <div class="auth__body">
            <a href="javascript:history.back()" class="auth__back d-inline-flex align-items-center tw-gap-2 text-main-600 font-heading fw-semibold"><i class="ph ph-arrow-left"></i>Back Now</a>
            <h1 class="auth__title fw-semibold text-slate-800">Let’s Get Started!</h1>
            <p class="auth__text text-slate-600">Please Enter your Email Address to Start your Online Application</p>

            <!-- labels + pill inputs reuse the contact form's field styles -->
            <form action="#" class="auth__form form-submit">
                <div class="auth__fields">
                    <div>
                        <label for="signup-first-name" class="contact-form__label d-block text-slate-800">First Name</label>
                        <input type="text" id="signup-first-name" class="contact-form__input auth__input" placeholder="Jone" autocomplete="given-name" required>
                    </div>
                    <div>
                        <label for="signup-last-name" class="contact-form__label d-block text-slate-800">Last Name</label>
                        <input type="text" id="signup-last-name" class="contact-form__input auth__input" placeholder="Fisher" autocomplete="family-name" required>
                    </div>
                    <div class="auth__full">
                        <label for="signup-email" class="contact-form__label d-block text-slate-800">Enter Your Email ID</label>
                        <input type="email" id="signup-email" class="contact-form__input auth__input" placeholder="Your email ID here" autocomplete="email" required>
                    </div>
                    <div class="auth__full">
                        <label for="signup-password" class="contact-form__label d-block text-slate-800">Password</label>
                        <input type="password" id="signup-password" class="contact-form__input auth__input" placeholder="Enter password" autocomplete="new-password" minlength="6" required>
                    </div>
                </div>
                <p class="auth__switch text-slate-600">Have an accounts? <a href="sing-in.html" class="text-orange-600 hover-text-main-600">Sign In</a></p>
                <button type="submit" class="btn btn-main hover-style-one button--stroke tw-duration-100 d-flex align-items-center justify-content-center w-100 rounded-pill auth__btn py-0 font-heading fw-semibold" data-block="button">
                    <span class="button__flair"></span>
                    <span class="button__label">Sign Up</span>
                </button>
            </form>
        </div>

        <p class="auth__copy text-slate-600 mb-0">Copyright © 2026 <a href="index.html" class="text-orange-600">eCommex</a>. All rights reserved.</p>
    </div>

    <div class="auth__media d-none d-lg-block">
        <img src="assets/images/thumbs/auth/sign-up.jpg" alt="Woman shopping on her phone in front of a clothing rail" class="w-100 h-100">
    </div>
</main>
<!-- ======================================== Sign up end =================================== -->
