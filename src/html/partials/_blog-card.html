<!-- Blog card start -->
<article class="blog-card h-100 d-flex flex-column">
    <a href="javascript:void(0)" class="blog-card__thumb position-relative d-block tw-rounded-xl overflow-hidden">
        <img src="assets/images/thumbs/blog/@@image.png" alt="@@title" class="w-100 h-100 object-fit-cover">
        <span class="blog-card__tag position-absolute rounded-pill @@tone">@@category</span>
    </a>
    <div class="blog-card__body">
        <div class="blog-card__meta d-flex align-items-center flex-wrap text-slate-600">
            <span class="d-inline-flex align-items-center tw-gap-1">
                <i class="ph ph-user text-main-600 tw-text-base tw-leading-none"></i>
                @@author
            </span>
            <span class="blog-card__dot"></span>
            <span class="d-inline-flex align-items-center tw-gap-1">
                <i class="ph ph-calendar-dots text-green-600 tw-text-base tw-leading-none"></i>
                @@date
            </span>
        </div>
        <h3 class="blog-card__title fw-semibold text-slate-800 line-clamp-2 mb-0">
            <a href="javascript:void(0)" class="hover-text-main-600">@@title</a>
        </h3>
    </div>
    <a href="javascript:void(0)" class="blog-card__more d-inline-flex align-items-center tw-gap-2 text-main-600 font-heading fw-semibold hover-underline">
        Read More
        <i class="ph ph-arrow-right tw-text-base"></i>
    </a>
</article>
<!-- Blog card end -->
