<img src="assets/images/thumbs/avatars/@@avatar.png" alt="@@name" class="bd-comment__avatar rounded-circle object-fit-cover">
<div class="bd-comment__head d-flex align-items-center flex-wrap">
    <h4 class="bd-comment__name fw-semibold text-slate-800 mb-0">@@name</h4>
    <span class="bd-comment__time text-slate-600">@@time</span>
</div>
<p class="bd-comment__text text-slate-600">“@@text”</p>
<div class="bd-comment__actions d-flex align-items-center">
    <button type="button" class="bd-comment__action @@likeTone d-inline-flex align-items-center" aria-label="Like"><i class="ph ph-thumbs-up"></i>320</button>
    <button type="button" class="bd-comment__action text-main-600 d-inline-flex align-items-center"><i class="ph ph-chat-centered-text"></i>Reply</button>
    <button type="button" class="bd-comment__action text-slate-800">Report</button>
</div>
