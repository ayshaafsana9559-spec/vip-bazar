<!-- ======================================== Coming soon start =================================== -->
<!-- full-screen page, no site header/footer -->
<main class="soon d-flex align-items-center text-center">
    <div class="container container-two">
        <h1 class="soon__title fw-bold text-main-two-600">Coming Soon!</h1>
        <p class="soon__text text-slate-600 mx-auto">We’re working hard to bring you something amazing. Stay tuned and get ready for a fresh experience launching soon.</p>

        <!-- counts down live from 02:12:15:45 (main.js [data-countdown]) -->
        <div class="soon__timer" data-countdown data-duration="216945" role="timer" aria-label="Launching in">
                <div class="soon-unit">
                    <div class="soon-unit__ring"><span class="soon-unit__num font-heading fw-bold" data-countdown-days>02</span></div>
                    <span class="soon-unit__label d-block font-heading fw-semibold text-main-two-600">Days</span>
                </div>
                <div class="soon-unit">
                    <div class="soon-unit__ring"><span class="soon-unit__num font-heading fw-bold" data-countdown-hours>12</span></div>
                    <span class="soon-unit__label d-block font-heading fw-semibold text-main-two-600">Hours</span>
                </div>
                <div class="soon-unit">
                    <div class="soon-unit__ring"><span class="soon-unit__num font-heading fw-bold" data-countdown-minutes>15</span></div>
                    <span class="soon-unit__label d-block font-heading fw-semibold text-main-two-600">Minutes</span>
                </div>
                <div class="soon-unit">
                    <div class="soon-unit__ring"><span class="soon-unit__num font-heading fw-bold" data-countdown-seconds>45</span></div>
                    <span class="soon-unit__label d-block font-heading fw-semibold text-main-two-600">Seconds</span>
                </div>
        </div>

        <form action="#" class="soon__form position-relative mx-auto form-submit">
            <input type="email" class="soon__input w-100 rounded-pill" placeholder="Enter your email..." aria-label="Email address" required>
            <button type="submit" class="soon__btn btn btn-main position-absolute rounded-pill py-0 font-heading fw-semibold">Notify Me</button>
        </form>

        <ul class="soon__socials d-flex align-items-center justify-content-center list-unstyled mb-0">
            <li><a href="https://www.facebook.com" class="soon__social" aria-label="Facebook"><i class="ph ph-facebook-logo"></i></a></li>
            <li><a href="https://www.instagram.com" class="soon__social" aria-label="Instagram"><i class="ph ph-instagram-logo"></i></a></li>
            <li><a href="https://www.pinterest.com" class="soon__social soon__social--active" aria-label="Pinterest"><i class="ph ph-pinterest-logo"></i></a></li>
            <li><a href="https://www.twitch.tv" class="soon__social" aria-label="Twitch"><i class="ph ph-twitch-logo"></i></a></li>
            <li><a href="https://www.linkedin.com" class="soon__social" aria-label="LinkedIn"><i class="ph ph-linkedin-logo"></i></a></li>
        </ul>
    </div>
</main>
<!-- ======================================== Coming soon end =================================== -->
