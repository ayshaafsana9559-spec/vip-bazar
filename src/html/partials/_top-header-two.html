<!-- ============================ Top header Start ============================ -->
<div class="top-header bg-main-600">
    <div class="container container-two">
        <div class="top-header__inner d-flex align-items-center justify-content-between tw-gap-6">
            <div class="d-flex align-items-center tw-gap-505">
                <a href="tel:2085550112" class="top-header__link d-flex align-items-center tw-gap-2 text-white">
                    <i class="ph ph-phone-call tw-text-base tw-leading-none"></i>
                    (208) 555-0112
                </a>
                <a href="mailto:demo@gmail.com" class="top-header__link d-md-flex d-none align-items-center tw-gap-2 text-white">
                    <i class="ph ph-envelope-open tw-text-base tw-leading-none"></i>
                    demo@gmail.com
                </a>
            </div>

            <a href="javascript:void(0)" class="top-header__link d-xl-flex d-none align-items-center tw-gap-305 text-white">
                Free delivery &amp; 40% Discount for next 3 orders!
                <i class="ph ph-arrow-up-right tw-text-base tw-leading-none"></i>
            </a>

            <div class="d-flex align-items-center tw-gap-5">
                <a href="order-tracking.html" class="top-header__link d-sm-flex d-none align-items-center tw-gap-2 text-white">
                    <i class="ph ph-truck tw-text-lg tw-leading-none"></i>
                    Tracking Orders
                </a>
                <span class="top-header__divider d-sm-block d-none"></span>
                <!-- Language select -->
                <div class="custom-select dropdown">
                    <select name="language" class="custom-select__native visually-hidden" tabindex="-1" aria-hidden="true">
                        <option value="en" selected>English</option>
                        <option value="bn">বাংলা</option>
                        <option value="fr">Français</option>
                        <option value="de">Deutsch</option>
                        <option value="es">Español</option>
                    </select>
                    <button type="button" class="custom-select__toggle top-header__link d-flex align-items-center tw-gap-105 text-white" data-bs-toggle="dropdown" data-bs-offset="0,14" aria-haspopup="listbox" aria-expanded="false" aria-label="Select language">
                        <img src="assets/images/icons/flag-uk.png" alt="English" class="custom-select__image tw-w-505 tw-h-505 rounded-circle">
                        <span class="custom-select__value">EN</span>
                        <i class="custom-select__caret ph ph-caret-down tw-text-sm tw-leading-none"></i>
                    </button>
                    <ul class="custom-select__menu dropdown-menu dropdown-menu-end" role="listbox" aria-label="Language">
                        <li role="none">
                            <button type="button" class="custom-select__option dropdown-item active" role="option" aria-selected="true" data-value="en" data-label="EN" data-image="assets/images/icons/flag-uk.png" data-alt="English">
                                <img src="assets/images/icons/flag-uk.png" alt="" class="custom-select__flag">
                                <span class="flex-grow-1">English</span>
                                <i class="custom-select__check ph-bold ph-check"></i>
                            </button>
                        </li>
                        <li role="none">
                            <button type="button" class="custom-select__option dropdown-item" role="option" aria-selected="false" data-value="bn" data-label="BN" data-image="assets/images/icons/flag-bd.svg" data-alt="বাংলা">
                                <img src="assets/images/icons/flag-bd.svg" alt="" class="custom-select__flag">
                                <span class="flex-grow-1">বাংলা</span>
                                <i class="custom-select__check ph-bold ph-check"></i>
                            </button>
                        </li>
                        <li role="none">
                            <button type="button" class="custom-select__option dropdown-item" role="option" aria-selected="false" data-value="fr" data-label="FR" data-image="assets/images/icons/flag-fr.svg" data-alt="Français">
                                <img src="assets/images/icons/flag-fr.svg" alt="" class="custom-select__flag">
                                <span class="flex-grow-1">Français</span>
                                <i class="custom-select__check ph-bold ph-check"></i>
                            </button>
                        </li>
                        <li role="none">
                            <button type="button" class="custom-select__option dropdown-item" role="option" aria-selected="false" data-value="de" data-label="DE" data-image="assets/images/icons/flag-de.svg" data-alt="Deutsch">
                                <img src="assets/images/icons/flag-de.svg" alt="" class="custom-select__flag">
                                <span class="flex-grow-1">Deutsch</span>
                                <i class="custom-select__check ph-bold ph-check"></i>
                            </button>
                        </li>
                        <li role="none">
                            <button type="button" class="custom-select__option dropdown-item" role="option" aria-selected="false" data-value="es" data-label="ES" data-image="assets/images/icons/flag-es.svg" data-alt="Español">
                                <img src="assets/images/icons/flag-es.svg" alt="" class="custom-select__flag">
                                <span class="flex-grow-1">Español</span>
                                <i class="custom-select__check ph-bold ph-check"></i>
                            </button>
                        </li>
                    </ul>
                </div>
                <span class="top-header__divider"></span>
                <!-- Currency select -->
                <div class="custom-select dropdown">
                    <select name="currency" class="custom-select__native visually-hidden" tabindex="-1" aria-hidden="true">
                        <option value="usd" selected>USD</option>
                        <option value="eur">EUR</option>
                        <option value="gbp">GBP</option>
                        <option value="bdt">BDT</option>
                    </select>
                    <button type="button" class="custom-select__toggle top-header__link d-flex align-items-center tw-gap-105 text-white" data-bs-toggle="dropdown" data-bs-offset="0,14" aria-haspopup="listbox" aria-expanded="false" aria-label="Select currency">
                        <span class="custom-select__value">USD</span>
                        <i class="custom-select__caret ph ph-caret-down tw-text-sm tw-leading-none"></i>
                    </button>
                    <ul class="custom-select__menu dropdown-menu dropdown-menu-end" role="listbox" aria-label="Currency">
                        <li role="none">
                            <button type="button" class="custom-select__option dropdown-item active" role="option" aria-selected="true" data-value="usd" data-label="USD">
                                <span class="custom-select__symbol">$</span>
                                <span class="flex-grow-1">USD <span class="custom-select__hint">US Dollar</span></span>
                                <i class="custom-select__check ph-bold ph-check"></i>
                            </button>
                        </li>
                        <li role="none">
                            <button type="button" class="custom-select__option dropdown-item" role="option" aria-selected="false" data-value="eur" data-label="EUR">
                                <span class="custom-select__symbol">€</span>
                                <span class="flex-grow-1">EUR <span class="custom-select__hint">Euro</span></span>
                                <i class="custom-select__check ph-bold ph-check"></i>
                            </button>
                        </li>
                        <li role="none">
                            <button type="button" class="custom-select__option dropdown-item" role="option" aria-selected="false" data-value="gbp" data-label="GBP">
                                <span class="custom-select__symbol">£</span>
                                <span class="flex-grow-1">GBP <span class="custom-select__hint">British Pound</span></span>
                                <i class="custom-select__check ph-bold ph-check"></i>
                            </button>
                        </li>
                        <li role="none">
                            <button type="button" class="custom-select__option dropdown-item" role="option" aria-selected="false" data-value="bdt" data-label="BDT">
                                <span class="custom-select__symbol">৳</span>
                                <span class="flex-grow-1">BDT <span class="custom-select__hint">Taka</span></span>
                                <i class="custom-select__check ph-bold ph-check"></i>
                            </button>
                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
<!-- ============================ Top header End ============================ -->
