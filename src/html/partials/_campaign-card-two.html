<!-- Campaign card two (thumbnails under the main image) start -->
<div class="campaign-card campaign-card--stack bg-white border border-slate-200 tw-rounded-xl h-100 d-flex flex-column">
    <div class="campaign-card__media d-flex flex-column">
        <a href="javascript:void(0)" class="campaign-card__main tw-rounded-lg overflow-hidden">
            <img src="assets/images/thumbs/campaigns/@@image-main.png" alt="@@title" class="w-100 h-100 object-fit-contain">
        </a>
        <div class="campaign-card__thumbs d-flex">
            <a href="javascript:void(0)" class="campaign-card__thumb tw-rounded-lg overflow-hidden"><img src="assets/images/thumbs/campaigns/@@image-1.png" alt="" class="w-100 h-100 object-fit-contain"></a>
            <a href="javascript:void(0)" class="campaign-card__thumb tw-rounded-lg overflow-hidden"><img src="assets/images/thumbs/campaigns/@@image-2.png" alt="" class="w-100 h-100 object-fit-contain"></a>
            <a href="javascript:void(0)" class="campaign-card__thumb tw-rounded-lg overflow-hidden"><img src="assets/images/thumbs/campaigns/@@image-3.png" alt="" class="w-100 h-100 object-fit-contain"></a>
        </div>
    </div>
    <div class="campaign-card__footer d-flex align-items-center justify-content-between tw-gap-3">
        <div>
            <h3 class="font-heading fw-semibold text-slate-800 tw-text-17-px line-clamp-1"><a href="javascript:void(0)" class="hover-text-main-600">@@title</a></h3>
            <span class="text-slate-600 tw-text-xs">@@count Items</span>
        </div>
        <a href="javascript:void(0)" class="campaign-card__shop btn btn-outline-main hover-style-two button--stroke tw-duration-100 d-inline-flex align-items-center justify-content-center rounded-pill flex-shrink-0 tw-px-5 py-0 font-heading fw-semibold tw-text-sm" data-block="button">
            <span class="button__flair"></span>
            <span class="button__label">Shop</span>
        </a>
    </div>
</div>
<!-- Campaign card two end -->
