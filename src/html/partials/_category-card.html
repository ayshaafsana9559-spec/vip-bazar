<!-- Category card start -->
<div class="category-card bg-white border border-slate-100 tw-rounded-xl h-100 d-flex flex-column">
    <div class="category-card__thumb position-relative">
        <a href="javascript:void(0)" class="category-card__img d-block border @@tone tw-rounded-lg overflow-hidden">
            <img src="assets/images/thumbs/categories/@@image.png" alt="@@title" class="w-100 h-100 object-fit-cover">
        </a>
        <span class="category-card__icon position-absolute bg-white border border-slate-100 rounded-circle d-flex align-items-center justify-content-center">
            <img src="assets/images/icons/category-card/@@icon.png" alt="">
        </span>
    </div>

    <h3 class="category-card__title fw-semibold text-slate-800 tw-text-xl">
        <a href="javascript:void(0)" class="hover-text-main-600">@@title</a>
    </h3>
    <p class="category-card__desc text-slate-500 tw-text-xs">@@desc</p>

    <div class="d-flex align-items-end justify-content-between tw-gap-2 mt-auto">
        <div class="d-flex flex-wrap tw-gap-1">
            <a href="javascript:void(0)" class="category-card__tag">@@tagOne</a>
            <a href="javascript:void(0)" class="category-card__tag">@@tagTwo</a>
            <a href="javascript:void(0)" class="category-card__tag">@@tagThree</a>
        </div>
        <a href="javascript:void(0)" class="category-card__arrow flex-shrink-0" aria-label="Browse @@title">
            <i class="ph ph-arrow-up-right"></i>
        </a>
    </div>
</div>
<!-- Category card end -->
