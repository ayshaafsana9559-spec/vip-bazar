<!-- ======================================== Review modal start =================================== -->
<div class="modal fade review-modal" id="reviewModal" tabindex="-1" aria-labelledby="reviewModalTitle" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content border-0">
            <div class="review-modal__head d-flex align-items-center justify-content-between">
                <h2 class="review-modal__title fw-semibold text-slate-800 mb-0" id="reviewModalTitle">Add Review</h2>
                <button type="button" class="review-modal__close" data-bs-dismiss="modal" aria-label="Close"><i class="ph ph-x"></i></button>
            </div>
            <form action="#" class="review-modal__form form-submit">
                <div class="review-modal__rating d-flex align-items-center flex-wrap">
                    <span class="review-modal__label" id="review-rating-label">Your review about this product:</span>
                    <!-- reversed order so "checked ~ label" fills every star up to the chosen one -->
                    <div class="rate-input d-flex flex-row-reverse justify-content-end" role="radiogroup" aria-labelledby="review-rating-label">
                        <input type="radio" name="rating" id="rate-5" value="5" class="visually-hidden"><label for="rate-5" aria-label="5 stars"><i class="ph ph-star"></i><i class="ph-fill ph-star"></i></label>
                        <input type="radio" name="rating" id="rate-4" value="4" class="visually-hidden"><label for="rate-4" aria-label="4 stars"><i class="ph ph-star"></i><i class="ph-fill ph-star"></i></label>
                        <input type="radio" name="rating" id="rate-3" value="3" class="visually-hidden" checked><label for="rate-3" aria-label="3 stars"><i class="ph ph-star"></i><i class="ph-fill ph-star"></i></label>
                        <input type="radio" name="rating" id="rate-2" value="2" class="visually-hidden"><label for="rate-2" aria-label="2 stars"><i class="ph ph-star"></i><i class="ph-fill ph-star"></i></label>
                        <input type="radio" name="rating" id="rate-1" value="1" class="visually-hidden"><label for="rate-1" aria-label="1 star"><i class="ph ph-star"></i><i class="ph-fill ph-star"></i></label>
                    </div>
                </div>

                <div class="review-modal__fields">
                    <div class="float-field review-modal__full">
                        <label for="review-name" class="float-field__label">Name</label>
                        <input type="text" id="review-name" class="float-field__input" placeholder="Enter name..." required>
                    </div>
                    <div class="float-field">
                        <label for="review-email" class="float-field__label">Gmail</label>
                        <input type="email" id="review-email" class="float-field__input" placeholder="Enter gmail..." required>
                    </div>
                    <div class="float-field">
                        <label for="review-phone" class="float-field__label">Phone</label>
                        <input type="tel" id="review-phone" class="float-field__input" placeholder="Enter number...">
                    </div>
                    <div class="float-field review-modal__full">
                        <label for="review-text" class="float-field__label">Review</label>
                        <textarea id="review-text" class="float-field__input float-field__input--area" placeholder="Enter your reviews..." required></textarea>
                    </div>
                </div>

                <div class="d-flex align-items-center flex-wrap tw-gap-2">
                    <button type="submit" class="btn btn-main hover-style-one button--stroke tw-duration-100 d-inline-flex align-items-center justify-content-center rounded-pill review-modal__btn py-0 font-heading fw-semibold" data-block="button">
                        <span class="button__flair"></span>
                        <span class="button__label">Submit Now</span>
                    </button>
                    <button type="button" class="btn btn-outline-main hover-style-two button--stroke tw-duration-100 d-inline-flex align-items-center justify-content-center rounded-pill review-modal__btn py-0 font-heading fw-semibold" data-bs-dismiss="modal" data-block="button">
                        <span class="button__flair"></span>
                        <span class="button__label">Cancel</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
<!-- ======================================== Review modal end =================================== -->
