<!-- Campaign card start -->
<div class="campaign-card bg-white border border-slate-200 tw-rounded-xl h-100 d-flex flex-column">
    <div class="campaign-card__media d-flex tw-gap-2">
        <a href="javascript:void(0)" class="campaign-card__main flex-grow-1 bg-yellow-25 tw-rounded-lg overflow-hidden">
            <img src="assets/images/thumbs/campaigns/@@image-main.png" alt="@@title" class="w-100 h-100 object-fit-cover">
        </a>
        <div class="campaign-card__thumbs d-flex flex-column tw-gap-2 flex-shrink-0">
            <a href="javascript:void(0)" class="campaign-card__thumb bg-green-25 tw-rounded-lg overflow-hidden"><img src="assets/images/thumbs/campaigns/@@image-1.png" alt="" class="w-100 h-100 object-fit-cover"></a>
            <a href="javascript:void(0)" class="campaign-card__thumb bg-purple-25 tw-rounded-lg overflow-hidden"><img src="assets/images/thumbs/campaigns/@@image-2.png" alt="" class="w-100 h-100 object-fit-cover"></a>
            <a href="javascript:void(0)" class="campaign-card__thumb bg-orange-25 tw-rounded-lg overflow-hidden"><img src="assets/images/thumbs/campaigns/@@image-3.png" alt="" class="w-100 h-100 object-fit-cover"></a>
        </div>
    </div>
    <div class="campaign-card__footer d-flex align-items-center justify-content-between tw-gap-3">
        <div>
            <h3 class="font-heading fw-semibold text-slate-800 tw-text-17-px line-clamp-1"><a href="javascript:void(0)" class="hover-text-main-600">@@title</a></h3>
            <span class="text-slate-600 tw-text-xs">@@count Items</span>
        </div>
        <a href="javascript:void(0)" class="campaign-card__shop btn btn-outline-main hover-style-two button--stroke tw-duration-100 d-inline-flex align-items-center justify-content-center rounded-pill flex-shrink-0 tw-h-9 tw-px-5 py-0 font-heading fw-semibold tw-text-sm" data-block="button">
            <span class="button__flair"></span>
            <span class="button__label">Shop</span>
        </a>
    </div>
</div>
<!-- Campaign card end -->
